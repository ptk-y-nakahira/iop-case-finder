<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>IoP 事例さがし</title>
<style>
:root {
  --bg: #f6f8f4; --card: #ffffff; --ink: #1f2a1c; --muted: #5d6b58; --line: #dfe6da;
  --accent: #2f8a1f; --accent-soft: #e6f3df; --chip: #eef2eb; --tag-j: #2b6ea8; --tag-i: #c8791a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141912; --card: #1d241a; --ink: #e8efe4; --muted: #a3b09d; --line: #2e3a2a;
    --accent: #7fd06a; --accent-soft: #24331f; --chip: #263022; --tag-j: #7fb4e6; --tag-i: #f0b062;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; line-height: 1.6; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 48px; }
header h1 { margin: 0; font-size: 1.6rem; letter-spacing: .02em; }
header p { margin: 4px 0 0; color: var(--muted); font-size: .92rem; }
.note { margin-top: 10px; font-size: .8rem; color: var(--muted); background: var(--chip);
  border-radius: 8px; padding: 6px 10px; display: inline-block; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 18px; }
.row { margin-top: 12px; }
.row:first-child { margin-top: 0; }
.label { font-size: .82rem; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.label b { color: var(--accent); margin-right: 4px; }
.cast { display: flex; flex-wrap: wrap; gap: 8px; }
.cast button { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 92px; padding: 6px 4px;
  background: var(--chip); border: 2px solid transparent; border-radius: 10px; cursor: pointer; color: var(--ink);
  font: inherit; font-size: .74rem; line-height: 1.25; }
.cast button img { width: 44px; height: 44px; image-rendering: pixelated; }
.cast button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { background: var(--chip); border: 1.5px solid transparent; border-radius: 999px; padding: 4px 12px;
  font: inherit; font-size: .85rem; color: var(--ink); cursor: pointer; }
.chips button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
input[type="search"] { width: 100%; padding: 9px 12px; font: inherit; font-size: 1rem; color: var(--ink);
  background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px; }
.bar { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; gap: 8px; flex-wrap: wrap; }
.count { font-weight: 700; }
.reset { background: none; border: 0; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; margin-top: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: .78rem; }
.kind { color: #fff; border-radius: 4px; padding: 1px 7px; font-weight: 700; }
.kind.j { background: var(--tag-j); } .kind.i { background: var(--tag-i); }
.team { color: var(--muted); }
.card h2 { font-size: 1.02rem; margin: 0; line-height: 1.45; }
.faces { display: flex; gap: 2px; }
.faces img { width: 30px; height: 30px; image-rendering: pixelated; }
dl { margin: 0; display: grid; grid-template-columns: 4.6em 1fr; gap: 4px 6px; font-size: .88rem; }
dt { color: var(--muted); font-weight: 700; }
dd { margin: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tags span { font-size: .74rem; background: var(--chip); border-radius: 4px; padding: 1px 6px; color: var(--muted); }
.src { font-size: .72rem; color: var(--muted); margin-top: auto; }
.empty { padding: 30px; text-align: center; color: var(--muted); }
footer { margin-top: 28px; font-size: .78rem; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>IoP 事例さがし</h1>
    <p>高知県 IoP技術者コミュニティの実証事業とアイデアソン（令和4〜7年度）から、近い事例をさがせます。</p>
    <span class="note">試作版・掲載内容は確認中です</span>
  </header>

  <section class="panel" aria-label="絞り込み">
    <div class="row">
      <div class="label"><b>1</b>どの登場人物の</div>
      <div class="cast" id="f-who"></div>
    </div>
    <div class="row">
      <div class="label"><b>2</b>どのような課題を</div>
      <div class="chips" id="f-type"></div>
    </div>
    <div class="row">
      <div class="label"><b>3</b>どのようなデータを使って</div>
      <div class="chips" id="f-data"></div>
    </div>
    <div class="row">
      <div class="label">ことばでさがす</div>
      <input type="search" id="q" placeholder="例：ナス、カメラ、水やり、手書き">
    </div>
    <div class="row">
      <div class="label">種類・年度</div>
      <div class="chips" id="f-kind"></div>
    </div>
  </section>

  <div class="bar">
    <span class="count" id="count"></span>
    <button class="reset" id="reset" type="button">条件をクリア</button>
  </div>
  <div class="grid" id="list"></div>

  <footer>
    出典：各年度の成果発表会・成果報告会での発表、各社の報道発表。内容は発表時点のものです。<br>
    高知県 IoP技術者コミュニティ（事務局：株式会社PROMPT-X）
  </footer>
</div>

・実の数・出荷量をつなげて、落花・収穫漏れ・廃棄などのどこで減っているかを数字にする。", "source": "令和6年度 成果発表会（2025年2月13日）"}, {"id": "i-r6-kut", "kind": "アイデアソン", "year": "R6", "team": "高知工科大学（学生チーム）", "student": true, "title": "農家どうしでデータや道具を共有するしくみ", "who": ["veteran", "novice"], "type": ["手間がかかる"], "data": ["投稿・記録"], "problem": "農家は一人ひとりで道具やデータを抱えていて、コストがかかる。", "how": "グループでデータを共有し、資源を貸し借りできるシステムの試作を動かして見せた。", "source": "令和6年度 成果発表会（2025年2月13日）"}, {"id": "i-r6-actnode", "kind": "アイデアソン", "year": "R6", "team": "アクト・ノード", "title": "地域の気象データをみんなで使えるようにする", "who": ["veteran", "kochi", "company"], "type": ["見えない"], "data": ["気象"], "problem": "畑ごとの環境データが地域で共有されていない。", "how": "地域に置いたセンサーの雨・温湿度・風・日射を共有し、指導や冷害の予測に使う。", "source": "令和6年度 成果発表会（2025年2月13日）"}, {"id": "i-r6-inoue", "kind": "アイデアソン", "year": "R6", "team": "井上石灰工業", "title": "高級トマトの収量を AI で予測する", "who": ["veteran"], "type": ["人に頼っている"], "data": ["温度・湿度", "出荷量"], "problem": "いまいちばん正確な収量予測は、栽培している人の感覚。", "how": "機械学習で予測アプリを作り、栽培者に聞きながら直す。1週間先はよく当たり、1か月先は難しかった。", "source": "令和6年度 成果発表会（2025年2月13日）"}, {"id": "i-r6-kochi", "kind": "アイデアソン", "year": "R6", "team": "高知県 農業イノベーション推進課", "title": "手書きの生産記録を集める手間を減らす（ニラ）", "who": ["kochi", "veteran"], "type": ["手間がかかる"], "data": ["手書き・紙"], "problem": "作付計画の書類を作るのに、手書きの記録を集めて書き写す必要がある。OCR でも楽にならなかった。", "how": "生産者に SAWACHI へ直接入力してもらう方法を比べた。", "source": "令和6年度 成果発表会（2025年2月13日）"}, {"id": "i-r7-kut", "kind": "アイデアソン", "year": "R7", "team": "高知工科大学（学生チーム）", "student": true, "title": "地域で農機具や人手を貸し借りし、規格外品も売る", "who": ["veteran", "novice", "others"], "type": ["手間がかかる"], "data": ["投稿・記録"], "problem": "農機具や人手が足りない。形が悪いだけの野菜が捨てられている。", "how": "農機具や人の空きを見えるようにして地域で共有し、規格外品を地域の中で流通させる。", "source": "令和7年度 成果報告会（2026年2月18日）"}, {"id": "i-r7-pacific", "kind": "アイデアソン", "year": "R7", "team": "パシフィックソフトウェア開発", "title": "動くカメラロボットで、葉の裏の病気や虫を見つける", "who": ["veteran", "company"], "type": ["見えない", "手間がかかる"], "data": ["画像"], "problem": "固定カメラでは葉の裏や株元が見えない。見回りの負担が大きい。", "how": "ハウスの中を動くカメラロボットで撮影し、AIエージェントが見つけてレポートする。", "source": "令和7年度 成果報告会（2026年2月18日）"}, {"id": "i-r7-kaminoba", "kind": "アイデアソン", "year": "R7", "team": "カミノバ", "title": "手書きの営農記録を AI で読み取ってグラフにする", "who": ["kochi", "veteran"], "type": ["手間がかかる"], "data": ["手書き・紙"], "problem": "農業の現場では AI がまだ使われていない。記録は手書きが多い。", "how": "手書きの記録を AI で読み取り、kintone で集めてグラフにする。AI が苦手なところは既存のツールで補う。", "source": "令和7年度 成果報告会（2026年2月18日）"}, {"id": "i-r7-butai", "kind": "アイデアソン", "year": "R7", "team": "舞台AI", "title": "作業しながら声で記録して、IoPクラウドに残す", "who": ["veteran"], "type": ["手間がかかる"], "data": ["音声"], "problem": "柚子畑などで作業している最中に、記録を残す手段がない。", "how": "スマホに話すと、AI（Dify）が整理して SAWACHI に保存し、画面で見られる。", "source": "令和7年度 成果報告会（2026年2月18日）"}, {"id": "i-r7-inoue", "kind": "アイデアソン", "year": "R7", "team": "井上石灰工業", "title": "FAX や手書きの注文書を AI で読み取って表にする", "who": ["veteran", "others"], "type": ["手間がかかる", "人に頼っている"], "data": ["手書き・紙", "画像"], "problem": "前の年の収量予測が当たらなかった。元になる記録が FAX や手書きのまま。", "how": "Google の GAS から生成AIを呼んで画像を読み取り、スプレッドシートにまとめる。", "source": "令和7年度 成果報告会（2026年2月18日）"}]</script>

<script>
const CASES = JSON.parse(document.getElementById("cases").textContent);
const SPR = JSON.parse(document.getElementById("sprites").textContent);
const WHO = [
  ["veteran", "生産者（ベテラン）"], ["novice", "生産者（新規就農者）"], ["kochi", "高知県"],
  ["maker", "農機具メーカー"], ["company", "農業以外の企業"], ["others", "その他"],
];
const WHO_NAME = Object.fromEntries(WHO);
// ボタンは幅が狭いので、語の切れ目で改行する
const BTN_NAME = { veteran: "生産者<br>（ベテラン）", novice: "生産者<br>（新規就農者）", maker: "農機具<br>メーカー", company: "農業以外の<br>企業" };
const TYPES = ["見えない", "手間がかかる", "人に頼っている"];
const TYPE_HINT = { "見えない": "測れていない・条件が分からない", "手間がかかる": "回数・時間・書き写し", "人に頼っている": "勘・目視・手書き" };
const DATA = [...new Set(CASES.flatMap(c => c.data))];
const KINDS = ["実証事業", "アイデアソン", "R4", "R5", "R6", "R7", "学生チーム"];

const sel = { who: new Set(), type: new Set(), data: new Set(), kind: new Set(), q: "" };

function toggle(btn, set, key) {
  set.has(key) ? set.delete(key) : set.add(key);
  btn.setAttribute("aria-pressed", set.has(key));
  render();
}
function chip(parent, set, key, text, title) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = text; b.setAttribute("aria-pressed", "false");
  if (title) b.title = title;
  b.onclick = () => toggle(b, set, key);
  parent.appendChild(b);
}

const fw = document.getElementById("f-who");
for (const [k, name] of WHO) {
  const b = document.createElement("button");
  b.type = "button"; b.setAttribute("aria-pressed", "false");
  b.innerHTML = `<img src="${SPR[k]}" alt="">${BTN_NAME[k] || name}`;
  b.onclick = () => toggle(b, sel.who, k);
  fw.appendChild(b);
}
TYPES.forEach(t => chip(document.getElementById("f-type"), sel.type, t, `${t}（${TYPE_HINT[t]}）`));
DATA.forEach(d => chip(document.getElementById("f-data"), sel.data, d, d));
KINDS.forEach(k => chip(document.getElementById("f-kind"), sel.kind, k, k));

const q = document.getElementById("q");
q.oninput = () => { sel.q = q.value.trim(); render(); };
document.getElementById("reset").onclick = () => {
  for (const s of [sel.who, sel.type, sel.data, sel.kind]) s.clear();
  sel.q = ""; q.value = "";
  document.querySelectorAll("[aria-pressed]").forEach(b => b.setAttribute("aria-pressed", "false"));
  render();
};

function anyOf(set, arr) { return set.size === 0 || arr.some(x => set.has(x)); }
function matchKind(c) {
  if (sel.kind.size === 0) return true;
  const kinds = [...sel.kind].filter(k => k === "実証事業" || k === "アイデアソン");
  const years = [...sel.kind].filter(k => /^R\d$/.test(k));
  if (kinds.length && !kinds.includes(c.kind)) return false;
  if (years.length && !years.includes(c.year)) return false;
  if (sel.kind.has("学生チーム") && !c.student) return false;
  return true;
}
function matchQ(c) {
  if (!sel.q) return true;
  const hay = [c.title, c.team, c.problem, c.how, c.data.join(" "), c.type.join(" "), c.who.map(w => WHO_NAME[w]).join(" ")].join(" ");
  return sel.q.split(/\s+/).every(w => hay.includes(w));
}
function esc(s) { return s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }

function render() {
  const hits = CASES.filter(c => anyOf(sel.who, c.who) && anyOf(sel.type, c.type) && anyOf(sel.data, c.data) && matchKind(c) && matchQ(c));
  document.getElementById("count").textContent = `${CASES.length}件中 ${hits.length}件`;
  const list = document.getElementById("list");
  if (!hits.length) { list.innerHTML = `<div class="empty">条件に合う事例がありません。条件をへらしてみてください。</div>`; return; }
  list.innerHTML = hits.map(c => `
    <article class="card">
      <div class="meta">
        <span class="kind ${c.kind === "実証事業" ? "j" : "i"}">${c.kind}</span>
        <span>令和${c.year.slice(1)}年度</span>
        <span class="team">${esc(c.team)}</span>
      </div>
      <h2>${esc(c.title)}</h2>
      <div class="faces">${c.who.map(w => `<img src="${SPR[w]}" alt="${WHO_NAME[w]}" title="${WHO_NAME[w]}">`).join("")}</div>
      <dl>
        <dt>課題</dt><dd>${esc(c.problem)}</dd>
        <dt>解決</dt><dd>${esc(c.how)}</dd>
      </dl>
      <div class="tags">${c.type.map(t => `<span>${t}</span>`).join("")}${c.data.map(d => `<span>${d}</span>`).join("")}</div>
      <div class="src">出典：${esc(c.source)}</div>
    </article>`).join("");
}
render();
</script>
</body>
